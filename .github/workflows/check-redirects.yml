name: Diagnose TikTok URL verification
on:
  push:
    paths: ['.github/workflows/check-redirects.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact status and headers without redirects
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://youlter1234-cmd.github.io/story-pipeline-website/"
          for URL in "$BASE" "${BASE}tiktoklosHyPHa8p0e1wAeuiArqH60ccPpzvIg.txt" "${BASE}terms.html" "${BASE}privacy.html"; do
            printf '\\nTesting %s\\n' "$URL"
            curl --silent --show-error --max-time 20 --output /tmp/probe-body --dump-header /tmp/probe-head --write-out 'status=%{http_code},redirects=%{num_redirects},url=%{url_effective},content_type=%{content_type}\\n' "$URL"
            grep -iE '^(HTTP/|location:|content-type:|cache-control:)' /tmp/probe-head || true
            if [[ "$URL" == *.txt ]]; then cat /tmp/probe-body; printf '\\n'; fi
          done
